[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Sans cette section, `netlify dev` attend Vite sur le port 5173 par defaut,
# alors que le projet le fixe a 3000 : le serveur ne demarrait jamais.
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "#custom"
  autoLaunch = false

# Toutes les adresses renvoient vers l'application, qui gere elle-meme sa navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Les traitements IA passent par une Edge Function : les fonctions classiques
# sont coupees au bout de dix secondes, insuffisant pour generer une image.

# En-tetes de securite de base.
#
# Pas de X-Frame-Options : le carrousel Projets du portfolio affiche chaque projet
# dans une iframe, et cet en-tete ne sait dire que "tout le monde" ou "personne",
# ALLOW-FROM n'etant plus supporte par les navigateurs. C'est frame-ancestors qui
# designe les sites autorises, ici le portfolio en ligne et le developpement local.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://*.netlify.app http://localhost:* http://127.0.0.1:*"
    # L'application n'utilise ni camera, ni micro, ni position, ni paiement.
    # Le dire ferme ces portes pour tout script tiers qui arriverait un jour.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Les fichiers du dossier assets portent une empreinte dans leur nom : un
# changement de contenu produit un nouveau nom. Ils peuvent donc etre gardes
# indefiniment par le navigateur. Sans cet en-tete, chaque visite retelechargeait
# le paquet principal et le lecteur PDF, soit plus d'un megaoctet.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les tables cmaps de pdf.js ne changent qu'avec la version de la bibliotheque.
[[headers]]
  for = "/cmaps/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# La page d'entree, elle, ne doit jamais etre gardee : c'est elle qui designe
# la version courante des fichiers empreintes.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
